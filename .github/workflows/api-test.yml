name: ReqRes API Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests with CSV
        run: |
          newman run "2474802010343_DangVoThanhTai_ReqRes.postman_collection.json" \
            -e "2474802010343_DangVoThanhTai_ReqRes_Env.postman_environment.json" \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "apiKey=${{ secrets.REQRES_API_KEY }}" \
            -d "data.csv" \
            -r cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: report.html
          if-no-files-found: warn
